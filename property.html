<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Details | Zeggo</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="header">

    <div class="logo">

        <a href="index.html">

            <i class="fa-solid fa-house"></i>

            <span>Zeggo</span>

        </a>

    </div>

    <nav class="navbar">

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="properties.html">Properties</a></li>

            <li><a href="agents.html">Agents</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

    <div class="header-buttons">

        <button class="sign-in-btn">

            Sign In

        </button>

    </div>

    <div class="menu-toggle">

        <i class="fa-solid fa-bars"></i>

    </div>

</header>

<main>

<section class="featured">
<div id="propertyDetails">

    <div class="property-page">

        <div class="property-image-container">

            <img
                id="propertyImage"
                src=""
                alt="Property Image">

        </div>

        <div class="property-info">

            <span
                id="propertyStatus"
                class="property-status">
            </span>

            <h1 id="propertyTitle"></h1>

            <h2
                id="propertyPrice"
                class="property-price">
            </h2>

            <p
                id="propertyAddress"
                class="property-location">
            </p>

            <div class="property-details">

                <span>
                    <i class="fa-solid fa-bed"></i>
                    <strong id="propertyBeds"></strong>
                    Bedrooms
                </span>

                <span>
                    <i class="fa-solid fa-bath"></i>
                    <strong id="propertyBaths"></strong>
                    Bathrooms
                </span>

                <span>
                    <i class="fa-solid fa-car"></i>
                    <strong id="propertyGarage"></strong>
                    Garage
                </span>

                <span>
                    <i class="fa-solid fa-ruler-combined"></i>
                    <strong id="propertyArea"></strong>
                </span>

            </div>

            <h3>Description</h3>

            <p id="propertyDescription"></p>

            <div style="margin-top:30px; display:flex; gap:15px; flex-wrap:wrap;">

                <a
                    href="properties.html"
                    class="view-details">

                    ← Back to Listings

                </a>

                <button
                    id="contactAgentBtn"
                    class="search-btn">

                    Contact Agent

                </button>

            </div>

        </div>

    </div>

</div>

</section>

  </div>

</section>

</main>

<footer class="footer">

    <div class="footer-bottom">

        <p>&copy; 2026 Zeggo. All rights reserved.</p>

    </div>

</footer>

<script src="properties.js"></script>
<script src="property.js"></script>

</body>
</html>
